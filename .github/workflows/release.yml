name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version (e.g. 0.2.2 or 0.3.0-beta.1). Leave empty to use bump.'
        required: false
        type: string
      bump:
        description: 'Auto bump when version is empty'
        required: false
        type: choice
        options: [patch, minor, major, prerelease]
        default: patch
      create_release:
        description: 'Commit version bump, create tag, and open a draft GitHub release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

# Never cancel a release build halfway through uploading.
concurrency:
  group: release-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build x64 installer
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_RID: win-x64
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      artifact: ${{ steps.bundle.outputs.artifact }}
    steps:
      # Third-party actions are pinned to a commit; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed so a dispatch release can push the version-bump commit + tag.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          CREATE_RELEASE: ${{ github.event.inputs.create_release }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            node scripts/set-version.mjs --check "$version" >/dev/null
            tag="$GITHUB_REF_NAME"
          else
            if [ -n "${INPUT_VERSION:-}" ]; then
              version="$(node scripts/set-version.mjs "$INPUT_VERSION")"
            else
              version="$(node scripts/set-version.mjs --bump "${INPUT_BUMP:-patch}")"
            fi
            tag="v${version}"

            if [ "${CREATE_RELEASE}" = true ]; then
              if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
                echo "::error::Tag ${tag} already exists."
                exit 1
              fi
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
              git commit -m "chore: release ${tag}"
              git tag "$tag"
              git push origin "HEAD:${GITHUB_REF_NAME}"
              git push origin "$tag"
            fi
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved version ${version} (tag ${tag})"

      # beforeBuildCommand fetches and verifies the driver installer, then builds the
      # native host and the web assets.
      - name: Build installer
        run: npx tauri build --ci

      - name: Rename installer (version suffix)
        id: bundle
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd src-tauri/target/release/bundle/nsis
          # Tauri default: EasyVirtualDisplay_<version>_x64-setup.exe
          src=$(ls -1 EasyVirtualDisplay_*_x64-setup.exe | head -n 1)
          # Desired: EasyVirtualDisplay-x64-setup-<version>.exe
          dst="EasyVirtualDisplay-x64-setup-${APP_VERSION}.exe"
          mv -f -- "$src" "$dst"
          sha256sum "$dst" > SHA256SUMS.txt
          {
            echo "Installer: \`$dst\`"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "artifact=${dst}" >> "$GITHUB_OUTPUT"
          echo "dir=${PWD}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch' && inputs.create_release != true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: EasyVirtualDisplay-x64-setup-${{ steps.version.outputs.version }}
          path: |
            src-tauri/target/release/bundle/nsis/${{ steps.bundle.outputs.artifact }}
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish draft release
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT: ${{ steps.bundle.outputs.artifact }}
        run: |
          set -euo pipefail
          cd src-tauri/target/release/bundle/nsis
          prerelease_args=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARTIFACT" SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$ARTIFACT" SHA256SUMS.txt \
              --draft \
              --title "Easy Virtual Display ${TAG}" \
              --generate-notes \
              "${prerelease_args[@]}"
          fi
